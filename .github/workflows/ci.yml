name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: lint-pip-${{ hashFiles('pyproject.toml') }}
      - run: pip install --no-cache-dir ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: mypy-pip-${{ hashFiles('pyproject.toml') }}
      - run: pip install --no-cache-dir -e ".[dev]"
      - run: mypy src/ --ignore-missing-imports

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix: { python-version: ["3.11", "3.12"] }
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: test-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
      - run: pip install --no-cache-dir -e ".[dev]"
      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          pytest tests/ \
            -m "not integration and not e2e and not slow" \
            --cov=src --cov-report=xml:coverage.xml \
            --cov-report=term-missing --junitxml=test-results.xml -v
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage-report, path: coverage.xml }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: test-results.xml }

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install --no-cache-dir bandit pip-audit
      - run: bandit -r src/ --severity-level medium -f json -o bandit-report.json || true
      - run: pip-audit --format json --output pip-audit-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json

  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      matrix:
        service:
          - api-gateway
          - chat-agent
          - rag-pipeline
          - scoring-service
          - forecast-service
          - content-generator
          - workflow-engine
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build -t ecosupplyai/${{ matrix.service }}:scan \
            -f infra/docker/Dockerfile.${{ matrix.service }} .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ecosupplyai/${{ matrix.service }}:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
