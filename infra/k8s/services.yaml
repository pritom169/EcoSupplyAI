---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecosupplyai
  namespace: ecosupplyai
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecosupplyai
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - { port: 8000, targetPort: 8000, protocol: TCP, name: http }
---
