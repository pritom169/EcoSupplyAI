---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecosupplyai
  labels: &gw-labels
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: ecosupplyai
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels: *gw-labels
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: ecosupplyai
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: api-gateway
          image: ecosupplyai.azurecr.io/api-gateway:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: ecosupplyai-config }
            - secretRef: { name: ecosupplyai-secrets }
          env:
            - { name: SERVICE_NAME, value: api-gateway }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
