apiVersion: v1
kind: ConfigMap
metadata:
  name: ecosupplyai-config
  namespace: ecosupplyai
data:
  DEPLOYMENT_ENV: "production"
  LOG_LEVEL: "INFO"
  AZURE_OPENAI_API_VERSION: "2024-10-21"
  AZURE_OPENAI_DEPLOYMENT_NAME: "gpt-4o"
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "text-embedding-3-small"
  QDRANT_URL: "http://qdrant:6333"
  REDIS_URL: "redis://redis:6379/0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  RAG_SERVICE_URL: "http://rag-pipeline:8002"
  SCORING_SERVICE_URL: "http://scoring-service:8003"
  FORECAST_SERVICE_URL: "http://forecast-service:8004"
  CONTENT_GEN_URL: "http://content-generator:8005"
  WORKFLOW_SERVICE_URL: "http://workflow-engine:8006"
  CHAT_SERVICE_URL: "http://chat-agent:8001"
