apiVersion: v1
kind: Secret
metadata:
  name: ecosupplyai-secrets
  namespace: ecosupplyai
  annotations:
    # IMPORTANT: In production, use External Secrets Operator (ESO) or Azure Key
    # Vault CSI driver to inject secrets. Never commit real secret values to Git.
    #
    # External Secrets Operator example:
    #   apiVersion: external-secrets.io/v1beta1
    #   kind: ExternalSecret
    #   metadata:
    #     name: ecosupplyai-secrets
    #     namespace: ecosupplyai
    #   spec:
    #     refreshInterval: 1h
    #     secretStoreRef:
    #       name: azure-keyvault
    #       kind: ClusterSecretStore
    #     target:
    #       name: ecosupplyai-secrets
    #     data:
    #       - secretKey: AZURE_OPENAI_API_KEY
    #         remoteRef:
    #           key: ecosupplyai-openai-api-key
    #       - secretKey: JWT_SECRET_KEY
    #         remoteRef:
    #           key: ecosupplyai-jwt-secret
    #       - secretKey: DATABASE_URL
    #         remoteRef:
    #           key: ecosupplyai-database-url
    description: >-
      Placeholder secrets for development only.
      Replace with ExternalSecret or SealedSecret in staging/production.
type: Opaque
stringData:
  AZURE_OPENAI_ENDPOINT: "https://your-openai.openai.azure.com/"
  AZURE_OPENAI_API_KEY: "REPLACE_ME"
  JWT_SECRET_KEY: "REPLACE_ME"
  DATABASE_URL: "postgresql+asyncpg://ecosupplyai:REPLACE_ME@postgres:5432/ecosupplyai"
