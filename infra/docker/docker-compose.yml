version: "3.9"

x-common-env: &common-env
  AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
  AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-4o}
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}
  AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
  DATABASE_URL: postgresql+asyncpg://ecosupplyai:${POSTGRES_PASSWORD:-ecosupplyai}@postgres:5432/ecosupplyai
  QDRANT_URL: http://qdrant:6333
  REDIS_URL: redis://redis:6379/0
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 10s

services:
  # ── Application Services ──────────────────────────────────────────────
  api-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api-gateway
    ports: ["8000:8000"]
    environment:
      <<: *common-env
      SERVICE_NAME: api-gateway
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      CHAT_SERVICE_URL: http://chat-agent:8001
      RAG_SERVICE_URL: http://rag-pipeline:8002
      SCORING_SERVICE_URL: http://scoring-service:8003
      FORECAST_SERVICE_URL: http://forecast-service:8004
      CONTENT_GEN_URL: http://content-generator:8005
      WORKFLOW_SERVICE_URL: http://workflow-engine:8006
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]

  chat-agent:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.chat-agent
    ports: ["8001:8001"]
    environment:
      <<: *common-env
      SERVICE_NAME: chat-agent
      RAG_SERVICE_URL: http://rag-pipeline:8002
      SCORING_SERVICE_URL: http://scoring-service:8003
      FORECAST_SERVICE_URL: http://forecast-service:8004
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]

  rag-pipeline:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.rag-pipeline
    ports: ["8002:8002"]
    environment:
      <<: *common-env
      SERVICE_NAME: rag-pipeline
    depends_on:
      qdrant: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/rag/health')"]

  scoring-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.scoring-service
    ports: ["8003:8003"]
    environment:
      <<: *common-env
      SERVICE_NAME: scoring-service
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]

  forecast-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.forecast-service
    ports: ["8004:8004"]
    environment:
      <<: *common-env
      SERVICE_NAME: forecast-service
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]

  content-generator:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.content-generator
    ports: ["8005:8005"]
    environment:
      <<: *common-env
      SERVICE_NAME: content-generator
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]

  workflow-engine:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.workflow-engine
    ports: ["8006:8006"]
    environment:
      <<: *common-env
      SERVICE_NAME: workflow-engine
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]

  # ── Infrastructure Services ───────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.7.4
    ports: ["6333:6333"]
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      <<: *healthcheck

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck

  postgres:
    image: pgvector/pgvector:pg16
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: ecosupplyai
      POSTGRES_USER: ecosupplyai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecosupplyai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecosupplyai"]
      <<: *healthcheck

  # ── Observability Stack ───────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.92.0
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter
    volumes:
      - ../../observability/otel_collector_config.yaml:/etc/otel/config.yaml
    command: ["--config", "/etc/otel/config.yaml"]

  prometheus:
    image: prom/prometheus:v2.48.1
    ports: ["9090:9090"]
    volumes:
      - ../../observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ../../observability/alerting_rules.yml:/etc/prometheus/alerting_rules.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.2.3
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ecosupplyai_overview.json
    volumes:
      - ../../observability/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana

  jaeger:
    image: jaegertracing/all-in-one:1.52
    ports:
      - "16686:16686"  # UI
      - "14268:14268"  # Collector HTTP

volumes:
  qdrant_data:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:
