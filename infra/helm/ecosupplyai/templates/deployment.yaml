{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "ecosupplyai.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $svc.port | quote }}
    spec:
      serviceAccountName: ecosupplyai
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: {{ $name }}
          image: {{ include "ecosupplyai.image" (dict "service" $svc "global" $.Values.global) }}
          imagePullPolicy: {{ $svc.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: {{ include "ecosupplyai.fullname" $ }}-config
            - secretRef:
                name: {{ include "ecosupplyai.fullname" $ }}-secrets
          env:
            - name: SERVICE_NAME
              value: {{ $name | quote }}
            - name: SERVICE_PORT
              value: {{ $svc.port | quote }}
          resources: {{- toYaml $svc.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /health, port: {{ $svc.port }} }
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: {{ $svc.port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
{{- end }}
{{- end }}
