[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# -----------------------------------------------------------------------------
# Project Metadata
# -----------------------------------------------------------------------------
[project]
name = "ecosupplyai"
version = "0.1.0"
description = "Multi-agent AI platform for sustainable supply-chain intelligence"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "EcoSupplyAI Team" }]
keywords = ["ai", "supply-chain", "sustainability", "multi-agent", "rag", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# -----------------------------------------------------------------------------
# Dependencies - organised by functional component
# -----------------------------------------------------------------------------
dependencies = [
    # -- Web Framework & API --------------------------------------------------
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.18",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",

    # -- Authentication & Security --------------------------------------------
    "python-jose[cryptography]>=3.3.0",

    # -- PII Detection & Anonymisation (Microsoft Presidio) -------------------
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",

    # -- Agent Orchestration --------------------------------------------------
    "semantic-kernel>=1.15.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",

    # -- LLM & Embedding Clients ----------------------------------------------
    "openai>=1.55.0",
    "tiktoken>=0.8.0",

    # -- Vector & Search Stores -----------------------------------------------
    "qdrant-client>=1.12.0",
    "azure-search-documents>=11.6.0",

    # -- Document Intelligence ------------------------------------------------
    "azure-ai-formrecognizer>=3.3.0",

    # -- Data Science & ML ----------------------------------------------------
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "shap>=0.46.0",
    "torch>=2.4.0",
    "matplotlib>=3.9.0",
    "joblib>=1.4.0",

    # -- HTTP & Async ---------------------------------------------------------
    "httpx>=0.28.0",

    # -- Database & ORM -------------------------------------------------------
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",

    # -- Caching & Event Bus --------------------------------------------------
    "redis>=5.2.0",

    # -- Observability (OpenTelemetry) ----------------------------------------
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "prometheus-client>=0.21.0",

    # -- Model Context Protocol -----------------------------------------------
    "mcp>=1.1.0",

    # -- Structured Logging ---------------------------------------------------
    "structlog>=24.4.0",
]

# -----------------------------------------------------------------------------
# Optional / Dev Dependencies
# -----------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "deepeval>=1.4.0",
    "ragas>=0.2.0",
    "locust>=2.32.0",
    "respx>=0.22.0",
]

# -----------------------------------------------------------------------------
# Ruff - Linter & Formatter
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S",
    "A", "C4", "DTZ", "T20", "RET", "SIM", "TCH", "ARG", "PTH", "RUF",
]
ignore = ["S101", "B008", "A003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["ecosupplyai"]

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--tb=short"]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require running services)",
    "e2e: End-to-end tests",
    "slow: Tests that take a long time to run",
    "eval: LLM evaluation tests",
]

# -----------------------------------------------------------------------------
# MyPy
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
